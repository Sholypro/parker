# Publie une nouvelle version de Parker.
# Déclencheur : un push sur main qui change le numéro de version dans Parker/Support/Info.plist
# (ou un lancement manuel depuis l'onglet Actions).
#
# Fichiers publiés dans la Release (triés par nom, groupés par système) :
#   Parker-Mac-Installer.dmg       à télécharger sur Mac (glisser Parker dans Applications)
#   Parker-Mac.zip                 mise à jour automatique Mac (toutes les versions déjà installées le lisent)
#   Parker-Windows-Installer.exe   à télécharger sur Windows (s'installe tout seul au premier lancement)
#   Parker-Windows.zip             mise à jour automatique Windows (nom attendu par l'app, ne pas renommer)
# Les versions Mac jusqu'à 2.1 prennent le premier .zip par ordre alphabétique : Parker-Mac.zip
# doit donc rester avant Parker-Windows.zip, et aucun autre .zip ne doit être publié.
#
# Signature (tout est optionnel, la publication marche sans) :
#   SIGNING_P12_BASE64 / SIGNING_P12_PASSWORD
#       certificat local "Parker Local" : garde les autorisations macOS d'une version à l'autre.
#   DEVELOPER_ID_P12_BASE64 / DEVELOPER_ID_P12_PASSWORD + APPLE_ID / APPLE_TEAM_ID / APPLE_APP_PASSWORD
#       certificat "Developer ID Application" (compte Apple Developer) + notarisation :
#       supprime l'alerte « Apple n'a pas pu confirmer… » au premier lancement.
#   WINDOWS_PFX_BASE64 / WINDOWS_PFX_PASSWORD
#       certificat de signature de code Windows : affiche l'éditeur au lieu de « Éditeur inconnu ».
# Voir docs/SIGNATURE.md.
name: Release

on:
  push:
    branches: [main]
    paths: ["Parker/Support/Info.plist", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    outputs:
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Parker/Support/Info.plist)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "La version $V est déjà publiée : rien à faire."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nouvelle version : $V"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Certificats de signature
        if: steps.version.outputs.skip != 'true'
        id: sign
        env:
          LOCAL_P12: ${{ secrets.SIGNING_P12_BASE64 }}
          LOCAL_PASS: ${{ secrets.SIGNING_P12_PASSWORD }}
          DEVID_P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVID_PASS: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KCPASS="$(openssl rand -hex 16)"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          import() {
            echo "$1" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$2" -T /usr/bin/codesign
            rm -f "$RUNNER_TEMP/cert.p12"
          }
          if [ -n "$DEVID_P12" ]; then import "$DEVID_P12" "$DEVID_PASS"; fi
          if [ -n "$LOCAL_P12" ]; then import "$LOCAL_P12" "$LOCAL_PASS"; fi
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPASS" "$KC" >/dev/null 2>&1 || true
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')

          DEVID="$(security find-identity -v -p codesigning "$KC" | grep '"Developer ID Application' | head -1 | awk '{print $2}' || true)"
          LOCAL="$(security find-identity -p codesigning "$KC" | grep '"Parker Local"' | head -1 | awk '{print $2}' || true)"
          if [ -n "$DEVID" ]; then
            echo "Signature : Developer ID Application"
            echo "identity=$DEVID" >> "$GITHUB_OUTPUT"
            echo "hardened=1" >> "$GITHUB_OUTPUT"
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
              echo "notarize=1" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::Developer ID présent mais identifiants Apple manquants : pas de notarisation."
            fi
          elif [ -n "$LOCAL" ]; then
            echo "Signature : Parker Local (pas de Developer ID : macOS demandera « Ouvrir quand même » au premier lancement)"
            echo "identity=$LOCAL" >> "$GITHUB_OUTPUT"
          else
            echo "Signature ad hoc"
          fi

      - name: Compiler Parker.app
        if: steps.version.outputs.skip != 'true'
        env:
          SC_VERSION: ${{ steps.version.outputs.version }}
          SC_SIGN_IDENTITY: ${{ steps.sign.outputs.identity }}
          SC_HARDENED: ${{ steps.sign.outputs.hardened }}
          PARKER_REQUIRE_SHADERS: "1"
        run: |
          chmod +x build-app.sh
          if ! ./build-app.sh --no-install > build.log 2>&1; then
            cat build.log
            # Visible dans le résumé de l'exécution (les journaux ne sont pas toujours accessibles)
            { grep -n -i -E "error|fatal|failed" build.log | head -20; tail -3 build.log; } | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          tail -5 build.log
          codesign -dv --verbose=2 dist/Parker.app 2>&1 | grep -E "Identifier|Authority|TeamIdentifier|Runtime|flags" || true
          test -s dist/Parker.app/Contents/Resources/BorderBeam.metallib

      - name: Notariser l'app
        if: steps.version.outputs.skip != 'true' && steps.sign.outputs.notarize == '1'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ditto -c -k --keepParent dist/Parker.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple dist/Parker.app
          spctl -a -vv dist/Parker.app

      - name: Créer Parker-Mac-Installer.dmg et les archives
        if: steps.version.outputs.skip != 'true'
        env:
          SC_SIGN_IDENTITY: ${{ steps.sign.outputs.identity }}
          NOTARIZE: ${{ steps.sign.outputs.notarize }}
        run: |
          STAGE="$RUNNER_TEMP/dmg"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          ditto dist/Parker.app "$STAGE/Parker.app"
          ln -s /Applications "$STAGE/Applications"
          if [ "$NOTARIZE" != "1" ]; then
            cp packaging/mac/Lisez-moi.txt "$STAGE/Lisez-moi.txt"
          fi
          hdiutil create -volname "Parker" -srcfolder "$STAGE" -fs HFS+ -format UDZO -ov Parker-Mac-Installer.dmg
          # Le .dmg n'est signé qu'avec un Developer ID (notarisation) : signé avec un certificat
          # non reconnu par Apple ("Parker Local"), macOS refuse même d'ouvrir l'image disque.
          if [ "$NOTARIZE" = "1" ] && [ -n "$SC_SIGN_IDENTITY" ]; then
            codesign --force --timestamp --sign "$SC_SIGN_IDENTITY" Parker-Mac-Installer.dmg
          fi
          hdiutil verify Parker-Mac-Installer.dmg
          ditto -c -k --keepParent dist/Parker.app Parker-Mac.zip
          ls -la Parker-Mac-Installer.dmg Parker-Mac.zip

      - name: Notariser le DMG
        if: steps.version.outputs.skip != 'true' && steps.sign.outputs.notarize == '1'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit Parker-Mac-Installer.dmg --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple Parker-Mac-Installer.dmg

      - name: Notes de version
        if: steps.version.outputs.skip != 'true'
        env:
          V: ${{ steps.version.outputs.version }}
          NOTARIZE: ${{ steps.sign.outputs.notarize }}
        run: |
          {
            echo "## Télécharger Parker $V"
            echo
            if [ "$NOTARIZE" != "1" ]; then
              echo "- **Mac, sans alerte (recommandé)** : ouvrir Terminal, coller \`curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/install.sh | bash\` puis Entrée."
            fi
            echo "- **Mac** (macOS 14 ou plus récent) : [Parker-Mac-Installer.dmg](https://github.com/$GITHUB_REPOSITORY/releases/download/v$V/Parker-Mac-Installer.dmg) : ouvrir, puis glisser Parker dans Applications."
            echo "- **Windows** (10 version 2004 ou plus récent, 11) : [Parker-Windows-Installer.exe](https://github.com/$GITHUB_REPOSITORY/releases/download/v$V/Parker-Windows-Installer.exe) : lancer, Parker s'installe tout seul."
            echo
            echo "Déjà installé ? Menu Parker > **Rechercher des mises à jour…**"
            echo
            if [ "$NOTARIZE" != "1" ]; then
              echo "### Premier lancement"
              echo "- **Mac** : si macOS affiche « Apple n'a pas pu confirmer… », cliquer sur **Terminé**, puis **Réglages Système > Confidentialité et sécurité**, tout en bas : **Ouvrir quand même**."
              echo "- **Windows** : si SmartScreen affiche « Windows a protégé votre ordinateur », cliquer sur **Informations complémentaires**, puis **Exécuter quand même**."
              echo
            fi
            echo "Les fichiers **.zip** servent uniquement à la mise à jour automatique de l'app : inutile de les télécharger."
          } > release-notes.md
          cat release-notes.md

      - name: Publier la release
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Parker ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: |
            Parker-Mac-Installer.dmg
            Parker-Mac.zip

  windows:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Compiler Parker.exe
        shell: pwsh
        run: |
          $v = "${{ needs.build.outputs.version }}"
          if ($v -notmatch '^\d+\.\d+\.\d+$') { $v = "$v.0" }
          dotnet publish windows/Parker/Parker.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true `
            -p:Version=$v -o out
          (Get-Item out/Parker.exe).VersionInfo | Format-List ProductName, FileDescription, CompanyName, ProductVersion, FileVersion

      - name: Signer Parker.exe (optionnel)
        shell: pwsh
        env:
          PFX: ${{ secrets.WINDOWS_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX) { Write-Host "Pas de certificat Windows : exécutable non signé."; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /f $pfx /p $env:PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "Parker" out/Parker.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $signtool.FullName verify /pa out/Parker.exe
          Remove-Item $pfx

      - name: Préparer les fichiers
        shell: pwsh
        run: |
          Copy-Item out/Parker.exe Parker-Windows-Installer.exe
          Compress-Archive -Path out/Parker.exe -DestinationPath Parker-Windows.zip
          Get-Item Parker-Windows-Installer.exe, Parker-Windows.zip | Select-Object Name, Length

      - name: Ajouter à la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          files: |
            Parker-Windows-Installer.exe
            Parker-Windows.zip

  # Libellés affichés sur la page de la release. Le nom du fichier (lu par les apps installées)
  # ne change pas : seul le texte affiché sur GitHub change.
  labels:
    needs: [build, windows]
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Libellés des fichiers
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: v${{ needs.build.outputs.version }}
        run: |
          label() {
            id="$(gh api "repos/$REPO/releases/tags/$TAG" --jq ".assets[] | select(.name == \"$1\") | .id")"
            [ -n "$id" ] && gh api -X PATCH "repos/$REPO/releases/assets/$id" -f name="$1" -f label="$2" --jq '.name + " : " + .label'
          }
          label Parker-Mac-Installer.dmg     "Parker-Mac-Installer.dmg (installer Parker sur Mac)"
          label Parker-Windows-Installer.exe "Parker-Windows-Installer.exe (installer Parker sur Windows)"
          label Parker-Mac.zip               "Parker-Mac.zip (mise à jour automatique, pas à télécharger)"
          label Parker-Windows.zip           "Parker-Windows.zip (mise à jour automatique, pas à télécharger)"
