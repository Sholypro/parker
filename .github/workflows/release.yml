# Publie une nouvelle version de Parker.
# Déclencheur : un push sur main qui change le numéro de version dans Parker/Support/Info.plist
# (ou un lancement manuel depuis l'onglet Actions).
# Résultat : une Release GitHub avec Parker.zip, que l'app de chacun détecte toute seule.
name: Release

on:
  push:
    branches: [main]
    paths: ["Parker/Support/Info.plist", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Parker/Support/Info.plist)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "La version $V est déjà publiée : rien à faire."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nouvelle version : $V"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Certificat de signature (optionnel)
        if: steps.version.outputs.skip != 'true'
        id: sign
        env:
          P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "Pas de secret SIGNING_P12_BASE64 : signature ad hoc."
            exit 0
          fi
          KC="$RUNNER_TEMP/signing.keychain-db"
          KCPASS="$(openssl rand -hex 16)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          HASH="$(security find-identity -p codesigning "$KC" | grep '"Parker Local"' | head -1 | awk '{print $2}')"
          echo "identity=$HASH" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build
        if: steps.version.outputs.skip != 'true'
        env:
          SC_VERSION: ${{ steps.version.outputs.version }}
          SC_SIGN_IDENTITY: ${{ steps.sign.outputs.identity }}
        run: |
          chmod +x build-app.sh
          ./build-app.sh --no-install
          ditto -c -k --keepParent dist/Parker.app Parker.zip
          codesign -dv dist/Parker.app 2>&1 | grep -E "Authority|Signature" || true

      - name: Publier la release
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Parker ${{ steps.version.outputs.version }}
          files: Parker.zip
          generate_release_notes: true
