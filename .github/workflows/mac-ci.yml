# Compile la version Mac à chaque modification (sans publier).
name: Mac CI

on:
  push:
    branches: [main]
    paths: ["Parker/**", ".github/workflows/mac-ci.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        working-directory: Parker
        run: |
          set -o pipefail
          # Compiler errors also become annotations, readable without the full log
          swift build -c release 2>&1 | tee "$RUNNER_TEMP/build.log" || {
            grep -E "error:" "$RUNNER_TEMP/build.log" | sort -u | head -20 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
      - name: Shaders Metal
        working-directory: Parker
        run: |
          xcrun -sdk macosx metal -mmacosx-version-min=14.0 -c Shaders/BeamShaders.metal -o "$RUNNER_TEMP/beam.air"
          xcrun -sdk macosx metallib "$RUNNER_TEMP/beam.air" -o "$RUNNER_TEMP/BorderBeam.metallib"
          ls -la "$RUNNER_TEMP/BorderBeam.metallib"
